seed: 0
dataset: paysim
paysim:
  path: ../data/raw/paysim.parquet
  protocol: natural
  n_rows: 500000
splits:
  train: 0.50
  ref: 0.20
  val: 0.15
  test: 0.15
synthesizer: identity
# Same size as train: identity with n_synth=10k is starved of fraud (~13 positives).
n_synth: 250000
output: results/paysim_natural_identity_ntrain.json
