seed: 0
dataset: paysim
paysim:
  path: ../data/raw/paysim.parquet
  protocol: natural
  n_rows: 500000
splits:
  train: 0.50
  ref: 0.20
  val: 0.15
  test: 0.15
synthesizer: tabddpm
synth:
  n_iter: 10000
  num_timesteps: 1000
  batch_size: 1024
  sample_batch: 4096
  lr: 0.002
  hidden: [256, 256, 256, 256]
n_synth: 10000
r_filter: true
r:
  pool_mult: 12
  min_margin: 0.15
  lambda_ua: 1.0
  c_pub: true
# TabDDPM (Kotelnikov et al.) on the same PaySim 500k T1 protocol as CTGAN/TVAE.
# Do not overwrite CTGAN or TVAE JSON. OpenMP: KMP_DUPLICATE_LIB_OK=TRUE (see tabddpm.py).
output_unfiltered: results/paysim_natural_tabddpm_unfiltered.json
r_outputs:
  - rate: 0.05
    controllers:
      rate_only: results/paysim_natural_tabddpm_r05_rateonly.json
