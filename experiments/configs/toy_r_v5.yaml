seed: 0
dataset: toy
n_rows: 4000
fraud_rate: 0.08
splits:
  train: 0.50
  ref: 0.20
  val: 0.15
  test: 0.15
synthesizer: independent
n_synth: 2000
r_filter: true
r:
  pool_mult: 4
  row_select: topk
  min_margin: 0.05
  lambda_ua: 1.0
  c_pub: true
# Sanitize the rate-only table. Do not overwrite v4 smoke JSON.
output_unfiltered: results/smoke_r_v5_unfiltered.json
r_outputs:
  - rate: 0.10
    controllers:
      rate_only: results/smoke_r_v5_r10_rateonly.json
    sanitizers:
      - name: jitter
        rel: 0.1
        output: results/smoke_r_v5_r10_jitter01.json
      - name: jitter
        rel: 0.5
        output: results/smoke_r_v5_r10_jitter05.json
      - name: withhold
        output: results/smoke_r_v5_r10_withhold.json
