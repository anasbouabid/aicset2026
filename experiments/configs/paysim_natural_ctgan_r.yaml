seed: 0
dataset: paysim
paysim:
  path: ../data/raw/paysim.parquet
  protocol: natural
  n_rows: 500000
splits:
  train: 0.50
  ref: 0.20
  val: 0.15
  test: 0.15
synthesizer: ctgan
n_synth: 10000
r_filter: true
r:
  pool_mult: 12
  min_margin: 0.15
  n_val_candidates: 6
  lambda_ua: 1.0
  elite_mult: 4.0
  c_pub: true
# Distinct names so the 2026-08-29 C_pub paired pointers stay the C vs no-C pair.
output_unfiltered: results/paysim_natural_ctgan_r_unfiltered.json
output_rate_only: results/paysim_natural_ctgan_r_rateonly.json
output: results/paysim_natural_ctgan_r.json
