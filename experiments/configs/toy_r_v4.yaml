seed: 0
dataset: toy
n_rows: 4000
fraud_rate: 0.08
splits:
  train: 0.50
  ref: 0.20
  val: 0.15
  test: 0.15
synthesizer: independent
n_synth: 2000
r_filter: true
r:
  pool_mult: 4
  row_select: topk
  min_margin: 0.05
  lambda_ua: 1.0
  c_pub: true
# Isolate margin vs type-preserving ranking. Do not overwrite v3 smoke JSON.
output_unfiltered: results/smoke_r_v4_unfiltered.json
r_outputs:
  - rate: 0.10
    controllers:
      topk: results/smoke_r_v4_r10.json
      rate_only: results/smoke_r_v4_r10_rateonly.json
      margin_random: results/smoke_r_v4_r10_margin.json
      type_topk: results/smoke_r_v4_r10_typetopk.json
