seed: 2
dataset: paysim
paysim:
  path: ../data/raw/paysim.parquet
  protocol: natural
  n_rows: 500000
splits:
  train: 0.50
  ref: 0.20
  val: 0.15
  test: 0.15
synthesizer: ctgan
n_synth: 10000
r_filter: true
r:
  pool_mult: 12
  row_select: topk
  rate_grid: [null, 0.01, 0.02, 0.05]
  min_margin: 0.15
  lambda_ua: 1.0
  c_pub: true
output_unfiltered: results/paysim_natural_ctgan_r_v2_seed2_unfiltered.json
output_rate_only: results/paysim_natural_ctgan_r_v2_seed2_rateonly.json
output: results/paysim_natural_ctgan_r_v2_seed2.json
